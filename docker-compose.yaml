version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: booking-postgres
    env_file:
      - .env.example
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: myapp
      DB_SSL_MODE: disable
      AUTH_JWT_SECRET: super-secret-key
      SERVER_PORT: 8080

      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d myapp" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - booking-network

  app:
    build: .
    container_name: booking-app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: myapp
      DB_SSL_MODE: disable
      AUTH_JWT_SECRET: super-secret-key
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations
    networks:
      - booking-network

volumes:
  postgres_data:

networks:
  booking-network:
    driver: bridge