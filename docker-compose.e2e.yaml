version: '3.8'

services:
  postgres_test:
    image: postgres:16-alpine
    container_name: booking-postgres-e2e
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "5433:5433"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - e2e-network

  app_test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-app-e2e
    environment:
      DB_HOST: postgres_test
      DB_PORT: 5432
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_NAME: test_db
      DB_SSL_MODE: disable

      JWT_SECRET: e2e-test-secret-key
      JWT_EXPIRATION_HOURS: 24

      SERVER_PORT: 8081

    ports:
      - "8081:8081"
    depends_on:
      postgres_test:
        condition: service_healthy
    networks:
      - e2e-network

networks:
  e2e-network:
    driver: bridge