services:
  postgres_test:
    image: postgres:16-alpine
    container_name: booking-postgres-e2e
    env_file: .env.example
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - e2e-network

  app_test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-app-e2e
    env_file: .env.example
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      postgres_test:
        condition: service_healthy
    networks:
      - e2e-network

networks:
  e2e-network:
    driver: bridge