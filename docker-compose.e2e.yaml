services:
  postgres_test:
    image: postgres:16-alpine
    container_name: booking-postgres-e2e
    env_file: .env.e2e.example
    environment:
      POSTGRES_USER: ${DB_USER:-test_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-test_password}
      POSTGRES_DB: ${DB_NAME:-test_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-test_user} -d ${DB_NAME:-test_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - e2e-network

  app_test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking-app-e2e
    env_file: .env.e2e.example
    ports:
      - "${SERVER_PORT:-8081}:${SERVER_PORT:-8081}"
    depends_on:
      postgres_test:
        condition: service_healthy
    networks:
      - e2e-network

networks:
  e2e-network:
    driver: bridge